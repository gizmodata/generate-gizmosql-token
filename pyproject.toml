[build-system]
requires      = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["./src"]  # list of folders that contain the packages (["."] by default)
include = ["*"]  # package names should match these glob patterns (["*"] by default)

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[project]
name = "generate-gizmosql-token"
version = "1.1.0"
description = "A package which generates a GizmoSQL token (JWT) for auth testing"
readme = "README.md"
authors = [{ name = "Philip Moore", email = "philip@gizmodata.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["gizmosql", "auth", "token", "bearer", "jwt"]
dependencies = [
    "click==8.4.*",
    "pyjwt==2.13.*",
    "cryptography==49.0.*",
    "python-dotenv==1.2.*",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "bumpver",
    "pip-tools",
    "pytest>=9.0",
]
integration = [
    "gizmosql>=1.35.1,<2",
    "adbc-driver-gizmosql>=2.0.0",
    "pyarrow",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that spin up a GizmoSQL server via the gizmosql PyPI package (deselect with '-m \"not integration\"')",
]

[project.urls]
Homepage = "https://github.com/gizmodata/generate-gizmosql-token"

[project.scripts]
generate-gizmosql-token = "generate_gizmosql_token.main:click_generate_gizmosql_token"

[tool.bumpver]
current_version = "1.1.0"
version_pattern = "MAJOR.MINOR.PATCH[PYTAGNUM]"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "v{new_version}"
commit = true
tag = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    '^version = "{version}"$',
    '^current_version = "{version}"$',
]
"src/generate_gizmosql_token/__init__.py" = [
    '^__version__ = "{version}"$',
]
